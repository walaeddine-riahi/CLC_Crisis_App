<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#003ba5" />
    <title>CLC Crisis</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#003ba5;color:#fff}body{display:grid;place-items:center;padding:24px}.card{text-align:center;max-width:340px}.icon{width:112px;height:112px;border-radius:26px;margin:auto;background:#fff url('/icons/icon-192.png') center/cover no-repeat}.spinner{width:32px;height:32px;margin:28px auto 16px;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}p{opacity:.82;line-height:1.5}button{border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#003ba5;font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true"></div>
      <h1>CLC Crisis</h1>
      <div class="spinner" aria-label="Connexion"></div>
      <p>Connexion sécurisée à la plateforme de pilotage…</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
